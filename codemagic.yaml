# codemagic.yaml
workflows:
  ios-app-build:
    name: Build SwByeDPI iOS App
    instance_type: mac_mini_m1
    environment:
      xcode: 15.2
      cocoapods: default
    scripts:
      - name: List available Xcode versions
        script: |
          echo "Listing available Xcode versions..."
          ls /Applications/ | grep Xcode
          echo "Please copy the list above and paste it back to the agent."
    artifacts:
      - build/ipa/*.ipa

